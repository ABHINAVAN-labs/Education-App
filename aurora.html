<!DOCTYPE html>

<html class="dark" lang="en"><head>

                      "on-primary-fixed": "#0a2100",
                      "background": "#12121c",
                      "primary": "#8eff42",
                      "error-container": "#93000a",
                      "tertiary-fixed": "#e4e1e9",
                      "surface-container-lowest": "#0d0d17",
                      "on-surface": "#e3e1ef",
                      "secondary-fixed-dim": "#ffaaf4",
                      "on-error": "#690005",
                      "error": "#ffb4ab",

              "borderRadius": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom Neumorphic Utilities */
        .neu-shadow {
            box-shadow: 6px 6px 16px rgba(5, 5, 8, 0.8), -2px -2px 8px rgba(255, 255, 255, 0.03);
        }
        .neu-inset {
            box-shadow: inset 4px 4px 8px rgba(5, 5, 8, 0.8), inset -2px -2px 4px rgba(255, 255, 255, 0.02);
        }

        .aurora-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.6;
            will-change: transform;
        }

        @keyframes aurora1 {
          0%   { transform: translate(0px, 0px) scale(1); }
          25%  { transform: translate(80px, -60px) scale(1.1); }
          50%  { transform: translate(-40px, 80px) scale(0.95); }
          75%  { transform: translate(60px, 40px) scale(1.05); }
          100% { transform: translate(0px, 0px) scale(1); }
        }
        @keyframes aurora2 {
          0%   { transform: translate(0px, 0px) scale(1); }
          33%  { transform: translate(-100px, 50px) scale(1.15); }
          66%  { transform: translate(70px, -80px) scale(0.9); }
          100% { transform: translate(0px, 0px) scale(1); }
        }
        @keyframes aurora3 {
          0%   { transform: translate(0px, 0px); }
          50%  { transform: translate(120px, 60px); }
          100% { transform: translate(0px, 0px); }
        }
        @keyframes aurora4 {
          0%   { transform: translate(0px, 0px) scale(1); }
          40%  { transform: translate(-80px, -40px) scale(1.2); }
          80%  { transform: translate(50px, 70px) scale(0.85); }
          100% { transform: translate(0px, 0px) scale(1); }
        }
    </style>
</head>
<body class="bg-surface-container-lowest text-on-background min-h-screen relative flex items-center justify-center overflow-x-hidden selection:bg-brand-teal/30 selection:text-brand-teal">
<!-- Top 40% Aurora Canvas -->
<div class="absolute top-0 left-0 w-full h-[300px] overflow-hidden pointer-events-none z-0">
<div class="aurora-blob w-[500px] h-[300px] bg-[#00c9a7] top-[-100px] left-[-100px]" style="animation: aurora1 25s ease-in-out infinite;"></div>
<div class="aurora-blob w-[600px] h-[350px] bg-[#7b2fff] top-[-150px] right-[-100px]" style="animation: aurora2 35s ease-in-out infinite;"></div>
<div class="aurora-blob w-[400px] h-[250px] bg-[#1a6fff] top-[-50px] left-[30%]" style="animation: aurora3 20s ease-in-out infinite;"></div>
<div class="aurora-blob w-[450px] h-[300px] bg-[#b040ff] top-[-80px] right-[10%]" style="animation: aurora4 40s ease-in-out infinite;"></div>
</div>
<!-- Main Content Wrapper -->
<main class="relative z-10 w-full max-w-6xl mx-auto px-4 md:px-8 py-12 flex flex-col items-center">
<!-- Brand / Header -->
<div class="mb-12 text-center">
<h1 class="font-headline-xl text-headline-xl tracking-tighter">
<span class="text-brand-ice drop-shadow-[0_0_15px_rgba(232,244,255,0.3)]">LUMINOUS</span>
<span class="text-brand-lavender drop-shadow-[0_0_15px_rgba(184,169,255,0.3)]">ETHER</span>
</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2 opacity-80">Access the nexus interface</p>
</div>
<!-- Central Glassmorphic Container -->
<div class="w-full bg-surface/40 backdrop-blur-[24px] border border-white/5 rounded-[2rem] p-6 md:p-10 shadow-[0_30px_60px_rgba(5,5,8,0.6)] flex flex-col lg:flex-row gap-8 lg:gap-12 relative overflow-hidden">
<!-- Subtle internal glass highlight -->
<div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-white/10 to-transparent pointer-events-none"></div>
<!-- Card 1: Sign In -->
<div class="flex-1 bg-surface-container-low rounded-3xl p-8 neu-shadow relative group">
<!-- Hover Glow Effect -->
<div class="absolute inset-0 bg-brand-teal/5 blur-2xl rounded-3xl opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none"></div>
<div class="relative z-10">
<h2 class="font-headline-lg text-headline-lg text-white mb-2 flex items-center gap-3">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 1;">login</span>
                        Sign In
                    </h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-8">Welcome back. Authenticate to continue.</p>
<form class="space-y-6">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2 pl-1">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50">mail</span>
<input class="w-full bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-xl py-3.5 pl-12 pr-4 border-none focus:ring-1 focus:ring-brand-teal neu-inset placeholder:text-on-surface-variant/30 transition-all" placeholder="Enter your email" type="email"/>
</div>
</div>
<div>
<div class="flex justify-between items-center mb-2 pl-1 pr-1">
<label class="block font-label-md text-label-md text-on-surface">Password</label>
<a class="font-label-md text-label-md text-brand-periwinkle hover:text-white transition-colors text-xs" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50">lock</span>
<input class="w-full bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-xl py-3.5 pl-12 pr-4 border-none focus:ring-1 focus:ring-brand-teal neu-inset placeholder:text-on-surface-variant/30 transition-all" placeholder="••••••••" type="password"/>
</div>
</div>
<button class="w-full mt-4 bg-gradient-to-r from-brand-violet to-brand-teal text-white font-label-md text-label-md rounded-xl py-4 uppercase tracking-widest shadow-[0_0_20px_rgba(123,47,255,0.2)] hover:shadow-[0_0_30px_rgba(0,201,167,0.4)] hover:brightness-110 transition-all duration-300 relative overflow-hidden group/btn" type="button">
<span class="relative z-10">Authenticate</span>
<div class="absolute inset-0 bg-white/20 translate-y-full group-hover/btn:translate-y-0 transition-transform duration-300 ease-out"></div>
</button>
</form>
</div>
</div>
<!-- Separator for mobile/desktop -->
<div class="hidden lg:flex flex-col items-center justify-center px-2">
<div class="w-[1px] h-32 bg-gradient-to-b from-transparent via-on-surface-variant/20 to-transparent"></div>
<span class="font-label-md text-label-md text-on-surface-variant/50 my-4 bg-surface/50 px-2 rounded-full border border-white/5 backdrop-blur-sm">OR</span>
<div class="w-[1px] h-32 bg-gradient-to-t from-transparent via-on-surface-variant/20 to-transparent"></div>
</div>
<div class="lg:hidden flex items-center justify-center py-4 w-full relative">
<div class="absolute left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-on-surface-variant/20 to-transparent"></div>
<span class="relative z-10 font-label-md text-label-md text-on-surface-variant/50 bg-surface px-4 py-1 rounded-full border border-white/5 backdrop-blur-sm">OR</span>
</div>
<!-- Card 2: Sign Up -->
<div class="flex-1 bg-surface-container-low rounded-3xl p-8 neu-shadow relative group">
<!-- Hover Glow Effect -->
<div class="absolute inset-0 bg-brand-violet/5 blur-2xl rounded-3xl opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none"></div>
<div class="relative z-10">
<h2 class="font-headline-lg text-headline-lg text-white mb-2 flex items-center gap-3">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 1;">person_add</span>
                        Sign Up
                    </h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-8">Initialize a new identity matrix.</p>
<form class="space-y-6">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2 pl-1">Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50">badge</span>
<input class="w-full bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-xl py-3.5 pl-12 pr-4 border-none focus:ring-1 focus:ring-brand-violet neu-inset placeholder:text-on-surface-variant/30 transition-all" placeholder="Enter your alias" type="text"/>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2 pl-1">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50">mail</span>
<input class="w-full bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-xl py-3.5 pl-12 pr-4 border-none focus:ring-1 focus:ring-brand-violet neu-inset placeholder:text-on-surface-variant/30 transition-all" placeholder="Enter your email" type="email"/>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2 pl-1">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50">key</span>
<input class="w-full bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-xl py-3.5 pl-12 pr-4 border-none focus:ring-1 focus:ring-brand-violet neu-inset placeholder:text-on-surface-variant/30 transition-all" placeholder="Create a strong key" type="password"/>
</div>
</div>
<button class="w-full mt-4 bg-transparent border border-brand-violet text-brand-violet font-label-md text-label-md rounded-xl py-4 uppercase tracking-widest hover:bg-brand-teal/10 hover:border-brand-teal hover:text-brand-teal hover:shadow-[0_0_15px_rgba(0,201,167,0.2)] transition-all duration-300" type="button">
                            Initialize
                        </button>
</form>
</div>
</div>
</div>
</main>
</body></html>
